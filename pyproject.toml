[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ollakit"
version = "0.1.0"
description = "Local Ollama toolkit: code review, RAG notes chat, file organizer"
requires-python = ">=3.10"
dependencies = ["ollama>=0.4"]

[project.scripts]
ollakit = "ollakit.cli:main"

[tool.setuptools]
packages = ["ollakit"]
